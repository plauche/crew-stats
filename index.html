<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/papaparse@5.7.0/papaparse.min.js"
        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"
        ></script>

        <title>Crew Stats</title>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="container">
            <h1>Crew Stats</h1>
            <input type="file" id="csv-file-input" accept=".csv,text/csv" />

            <p id="status" role="status"></p>

            <div role="tablist" aria-label="Views">
                <button
                    type="button"
                    role="tab"
                    id="tab-transactions"
                    aria-controls="panel-transactions"
                    aria-selected="true"
                    tabindex="0"
                >
                    Transactions
                </button>
                <button
                    type="button"
                    role="tab"
                    id="tab-pockets"
                    aria-controls="panel-pockets"
                    aria-selected="false"
                    tabindex="-1"
                >
                    Pockets
                </button>
            </div>

            <section
                role="tabpanel"
                id="panel-transactions"
                aria-labelledby="tab-transactions"
                tabindex="0"
            >
                <div id="table-container"></div>
            </section>

            <section
                role="tabpanel"
                id="panel-pockets"
                aria-labelledby="tab-pockets"
                tabindex="0"
                hidden
            >
                <label for="pocket-select">Pocket</label>
                <select id="pocket-select"></select>

                <p id="pocket-status" role="status"></p>
                <div id="pocket-container"></div>
            </section>
        </main>

        <dialog id="transaction-card" aria-labelledby="transaction-card-title">
            <article>
                <header>
                    <button
                        type="button"
                        rel="prev"
                        aria-label="Close"
                        id="transaction-card-close"
                    >
                        ×
                    </button>
                    <p id="transaction-card-title"></p>
                </header>
                <dl id="transaction-card-fields"></dl>
            </article>
        </dialog>

        <script defer src="main.js"></script>
    </body>
</html>
